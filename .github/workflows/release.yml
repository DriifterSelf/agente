name: Release Windows Executable & OTA

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión del release (ej. v1.2.0, v1.3.0, v2.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Windows Release
    runs-on: windows-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🐍 Configurar Python (3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Instalar dependencias del proyecto
        run: |
          npm install --no-audit

      - name: 🏷️ Sincronizar versión de package.json con el Tag (v1.2.0, v1.3.0, v2.0.0...)
        shell: pwsh
        run: |
          $rawVersion = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($rawVersion)) {
            $rawVersion = "${{ github.ref_name }}"
          }
          Write-Host "Referencia / Tag detectado: $rawVersion"
          if ($rawVersion -match '(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)') {
            $cleanVersion = $Matches[1]
            Write-Host "Actualizando package.json a la versión: $cleanVersion"
            npm version $cleanVersion --no-git-tag-version --allow-same-version
          } else {
            Write-Host "No se detectó patrón semver en '$rawVersion', manteniendo versión de package.json"
          }

      - name: 📦 Empaquetar e integrar binarios de Python (3.11 Portable) y Runtime GPU
        run: |
          npm run prepare:python

      - name: 🔨 Compilar Frontend (Vite)
        run: |
          npm run build

      - name: 🚀 Empaquetar y Publicar en GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-builder --win --publish always
